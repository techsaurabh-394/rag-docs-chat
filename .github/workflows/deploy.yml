name: Deploy

# Runs after CI succeeds on main (or manually). Builds and publishes a Docker
# image to GHCR, then triggers a Render deploy and waits for /api/health.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha || github.sha }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        id: cfg
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not set. Image was published, skipping deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Render deploy
        if: steps.cfg.outputs.go == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$HOOK"
      - name: Wait for health check
        if: steps.cfg.outputs.go == 'true' && vars.APP_URL != ''
        env:
          URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$URL/api/health" | grep -q '"status":"ok"'; then
              echo "Healthy: $URL"; exit 0
            fi
            echo "Waiting ($i/30)..."; sleep 20
          done
          echo "Deploy did not become healthy in 10 minutes"; exit 1
