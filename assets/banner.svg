<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="rag-docs-chat: ask your documents and get answers that cite the exact source passage. A chat card shows a question, an answer with a citation, and a faithfulness score.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1b1646"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ea8fe"/><stop offset="1" stop-color="#7ee2b8"/></linearGradient></defs>
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.a{animation:rise .9s ease-out both}.b{animation:rise .9s .3s ease-out both}.c{animation:rise .9s .6s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q{animation:pop .7s .6s ease-out both}.r{animation:pop .7s 1.4s ease-out both}.s{animation:pop .7s 2.1s ease-out both}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.chip{animation:pulse 2s 2.5s ease-in-out infinite}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.d1{animation:dot 1.2s infinite}.d2{animation:dot 1.2s .2s infinite}.d3{animation:dot 1.2s .4s infinite}
@keyframes fill{from{width:0}to{width:150px}}
.bar{animation:fill 1.2s 2.2s ease-out both}
</style>
<rect width="1200" height="320" fill="url(#bg)"/>
<g stroke="rgba(255,255,255,.05)"><path d="M0 64H1200M0 128H1200M0 192H1200M0 256H1200M120 0V320M360 0V320M600 0V320M840 0V320M1080 0V320"/></g>
<text class="a" x="70" y="112" font-size="60" font-weight="800" fill="#fff">rag-docs-chat</text>
<rect class="a" x="72" y="130" width="150" height="5" rx="2.5" fill="url(#ac)"/>
<text class="b" x="72" y="180" font-size="26" font-weight="600" fill="url(#ac)">Ask your documents. Get cited answers.</text>
<text class="b" x="72" y="220" font-size="19" fill="#c8cede">Hybrid retrieval (BM25 + vectors), a faithfulness check,</text>
<text class="b" x="72" y="248" font-size="19" fill="#c8cede">no vector database and no API key needed to try it.</text>
<text class="c" x="72" y="292" font-size="16" fill="#8b93a7">By Saurabh Pathak · Python · FastAPI · MIT</text>
<g transform="translate(700 36)">
<rect width="440" height="248" rx="16" fill="#151a36" stroke="#3a4380" stroke-width="1.5"/>
<circle cx="22" cy="22" r="5" fill="#ff5f56"/><circle cx="40" cy="22" r="5" fill="#ffbd2e"/><circle cx="58" cy="22" r="5" fill="#27c93f"/>
<g class="q"><rect x="118" y="44" width="304" height="40" rx="12" fill="#2a2f55"/>
<text x="134" y="69" font-size="14.5" fill="#e6e8ee">Where should refresh tokens be stored?</text></g>
<g class="r"><rect x="18" y="98" width="404" height="78" rx="12" fill="#1b2150" stroke="#4a549a"/>
<text x="34" y="124" font-size="14" fill="#c8cede">Refresh tokens should be stored in an httpOnly</text>
<text x="34" y="146" font-size="14" fill="#c8cede">cookie and rotated on every use to detect theft.</text>
<g class="chip"><rect x="34" y="154" width="150" height="18" rx="9" fill="#6ea8fe" fill-opacity=".18" stroke="#6ea8fe"/>
<text x="109" y="167" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6ea8fe">[1] jwt_auth.txt · p.1</text></g></g>
<g class="s"><text x="22" y="205" font-size="12.5" fill="#8b93a7">Faithfulness</text>
<rect x="110" y="195" width="150" height="10" rx="5" fill="#2a2f55"/>
<rect class="bar" x="110" y="195" width="150" height="10" rx="5" fill="#7ee2b8"/>
<text x="272" y="205" font-size="12.5" font-weight="700" fill="#7ee2b8">1.00 · 0 unsupported</text></g>
<g><circle class="d1" cx="30" cy="229" r="3" fill="#6ea8fe"/><circle class="d2" cx="42" cy="229" r="3" fill="#6ea8fe"/><circle class="d3" cx="54" cy="229" r="3" fill="#6ea8fe"/></g>
</g>
</svg>
